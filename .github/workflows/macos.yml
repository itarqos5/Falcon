# Builds Falcon on macOS (Apple silicon) and runs the unit tests. The game is the same GLFW + OpenGL client as on the other systems; the launcher is not built here,
# because its window is the system web view (WebView2 on Windows, WebKitGTK on Linux) and a Mac has neither.
name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']  # (a release's tag: the build is attached to that release); no path filter, so a tag always runs
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # (to attach the build to a release)

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: brew install openssl@3 ninja ccache

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-${{ github.sha }}
          restore-keys: macos-

      - name: Configure
        run: cmake --preset release -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)" -DFALCON_BUILD_LAUNCHER=OFF

      - name: Build the client
        run: cmake --build --preset release -j 4

      - name: Test
        run: cmake --build --preset check -j 4

      - name: What the program links against
        run: |
          otool -L build/Falcon || true
          ls -l build/Falcon

      - name: Upload the Mac build
        uses: actions/upload-artifact@v4
        with:
          name: falcon-macos
          path: build/Falcon
          if-no-files-found: error

      # A tag's build is the release's Mac download. The launcher is not built on a Mac yet, so this is the client itself: unpack it, name the game folder with
      # --game-dir, or run the launcher elsewhere. (The Intel runner makes an Intel binary; Apple silicon runs it under Rosetta.)
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/Falcon out-Falcon-macos-x86_64
          shasum -a 256 out-Falcon-macos-x86_64 | cut -d' ' -f1 > out-Falcon-macos-x86_64.sha256
          gh release upload "$TAG" out-Falcon-macos-x86_64 out-Falcon-macos-x86_64.sha256 --clobber --repo "$GITHUB_REPOSITORY"
