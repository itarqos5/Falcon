# Builds the Linux launcher (with the Falcon client inside it) for a release and attaches it to that release.
#
#   when a release is published        the build of that release's tag
#   run by hand (Actions -> Linux release -> Run workflow)   the build of the tag given, for a release that is already out
#
# The Windows launcher is built on a Windows PC and uploaded by hand; this one is built from the tagged source, on Ubuntu 22.04 (glibc 2.35), so it runs on any distribution at least that new.
name: Linux release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to build and attach to (for example v1.2.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 cmake ninja-build ccache pkg-config libssl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols extra-cmake-modules \
            libgl1-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-linux
          restore-keys: linux-

      - name: Build
        run: |
          cmake --preset release -DFALCON_STATIC_OPENSSL=ON -DFALCON_BUILD_LAUNCHER=ON -DFALCON_BUILD_TESTS=OFF
          cmake --build --preset launcher -j 4

      - name: Package
        run: |
          mkdir -p out
          cp dist-launcher/FalconLauncher out/FalconLauncher-linux-x86_64
          chmod +x out/FalconLauncher-linux-x86_64
          (cd out && sha256sum FalconLauncher-linux-x86_64 > FalconLauncher-linux-x86_64.sha256)
          ls -l out
          cat out/FalconLauncher-linux-x86_64.sha256

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/FalconLauncher-linux-x86_64 out/FalconLauncher-linux-x86_64.sha256 --clobber --repo "$GITHUB_REPOSITORY"
