# Builds Falcon and its launcher on Linux and runs the unit tests (Ubuntu 22.04: the oldest glibc a current runner has, so the programs run on most distributions).
#
#   on every push and pull request   the client, the client with the ownership check, the launcher, all test suites under a virtual display, and the launcher's windows (invisible)
name: Linux

on:
  push:
    branches: [main, linux]
    paths-ignore: ['website/**', 'docs/**', '**.md', '.github/workflows/discord.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 cmake ninja-build ccache pkg-config libssl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols extra-cmake-modules \
            libgl1-mesa-dev libgl1-mesa-dri xvfb \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ github.sha }}
          restore-keys: linux-

      - name: Configure
        run: cmake --preset release -DFALCON_STATIC_OPENSSL=ON -DFALCON_BUILD_LAUNCHER=ON

      - name: Build the client
        run: cmake --build --preset release -j 4 -- -k 0

      - name: Build the launcher (with the client that checks ownership inside it)
        run: cmake --build --preset launcher -j 4 -- -k 0

      - name: Test
        run: xvfb-run -a cmake --build --preset check -j 4

      - name: What the programs link against
        run: |
          ldd build/Falcon || true
          ldd dist-launcher/FalconLauncher || true
          ls -l build/Falcon build/licensed/Falcon dist-launcher/FalconLauncher

      - name: The launcher's window, drawn in a virtual display
        env:
          GDK_BACKEND: x11
          FALCON_LAUNCHER_HOME: ${{ runner.temp }}/falcon-launcher-home
          FALCON_LAUNCHER_LOG_STDERR: '1'
        run: |
          mkdir -p shots
          for state in signin home running; do
            xvfb-run -a -s "-screen 0 1280x800x24" dist-launcher/FalconLauncher --mock $state --screenshot shots/launcher-$state.png --wait 2500 || echo "screenshot of $state failed"
          done
          xvfb-run -a -s "-screen 0 1280x800x24" dist-launcher/FalconLauncher --selftest-signin; echo "sign-in self-test exit code $?"
          ls -l shots

      # The game's own files, downloaded from Mojang the way the launcher does it for a player (and Falcon's data tables, from the release): the checks of the world generator
      # against the game's output need them. Nothing of it is kept or published.
      - name: Download the game's files
        env:
          FALCON_LAUNCHER_LOG_STDERR: '1'
        run: |
          dist-launcher/FalconLauncher --selftest-install "$RUNNER_TEMP/game" || true
          cat "$RUNNER_TEMP/game/selftest-install.txt"
          ls "$RUNNER_TEMP/game/26.3" | head -30

      - name: Tests on the game's own data
        env:
          FALCON_ASSETS_DIR: ${{ runner.temp }}/game/26.3/assets
        run: xvfb-run -a ctest --test-dir build --output-on-failure -V -R "falcon_(tests|worldgen_tests|worldgen_chunk_tests|item_tests|world_tests|net_tests|logic_tests)" | grep -E "skipped|Test +#|tests passed|tests failed|CHECK failed" || true

      - name: The game, in a hidden window, in a world
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        timeout-minutes: 10
        run: |
          mkdir -p shots "$RUNNER_TEMP/scratch"
          cmake --build build --target falcon_make_world -j 4
          build/tests/falcon_make_world "$RUNNER_TEMP/scratch/saves" "New World" 12345 creative
          # (a hard limit on the game: a window that never comes up must not hold the run)
          timeout 240 xvfb-run -a -s "-screen 0 1280x800x24" build/Falcon --assets "$RUNNER_TEMP/game/26.3/assets" --data "$RUNNER_TEMP/game/26.3" --game-dir "$RUNNER_TEMP/scratch" \
            --play "New World" --mute --render-distance 8@0.5 --gamemode creative --cam 96.5,72,73.5,-35,12 --size 1280x720 --capture shots/world.png --capture-after 12 2>&1 | tail -40
          echo "game exit code ${PIPESTATUS[0]}"
          ls -l shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: shots
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-launcher
          path: dist-launcher/FalconLauncher
          retention-days: 7
